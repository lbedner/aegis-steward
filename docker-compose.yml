
x-app: &app
  # The tag names THIS project. It used to default to the shared
  # ``aegis-stack:latest``, which four stacks on one machine all claimed,
  # so whichever built last re-pointed the image the others ran - see
  # tests/test_the_image_tag_names_this_project.py for what that cost.
  # aegis-stack fixed this upstream by defaulting to the project slug;
  # steward was generated before that.
  image: ${AEGIS_STACK_TAG:-aegis-steward:latest}
  build:
    context: .
    args:
      - AEGIS_STACK_VERSION=${AEGIS_STACK_VERSION:-dev}
      - PORT=${PORT:-8000}
  env_file:
    - ${AEGIS_STACK_ENV_FILE:-.env}
  environment:
    # Docker container marker for entrypoint script. A service that sets
    # its own environment list REPLACES this one (YAML merge keys do not
    # join lists), so anything every container must see lives in the
    # Dockerfile's ENV (PORT, STORAGE_ROOT), not here.
    - DOCKER_CONTAINER=1
    - PORT=${PORT:-8000}
    - WEBSERVER_ENGINE=${WEBSERVER_ENGINE:-uvicorn}
  volumes:
    # Every process that runs the app shares one object store. Compose
    # merges volume lists across override files by target path, so the
    # dev overlay's code mount adds to this rather than replacing it.
    - storage-data:/data/storage
    # And one DATABASE, on a named volume rather than the bind mount.
    # SQLite has one writer, and the cheap way to let readers and that
    # writer coexist is WAL - which coordinates readers through shared
    # memory mapped from a -shm file, coherent only between processes
    # on ONE kernel. Under the bind mount the host CLI and four Linux
    # containers were two kernels looking at one file, so WAL was
    # unsafe, so every read-then-write had to retry a lock upgrade by
    # hand. A named volume is the container boundary the file never
    # crosses: one kernel, WAL safe, the lock handled in the engine.
    #
    # The cost is deliberate: the host can no longer open this file.
    # Anything that talks to the database runs `docker compose exec`.
    - aegis-data:/data/db
    # Where the scheduler's backup job writes dumps. Named, so they survive
    # container recreation and the deploy's rsync. It lives here, not on the
    # scheduler: a service-level volumes list REPLACES this one, which once
    # left the scheduler on its own empty database.
    - backup-data:/var/backups/app
  labels:
    logging: "aegis-stack"

services:
  # DEVELOPMENT PROFILE

  webserver:
    <<: *app
    command:
      - webserver
    ports:
      # Host port auto-selected by `make serve` (WEBSERVER_HOST_PORT);
      # falls back to PORT for a raw `docker compose up`.
      - "${WEBSERVER_HOST_PORT:-${PORT:-8000}}:${PORT:-8000}"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Docker container marker
      - DOCKER_CONTAINER=1
      - WEBSERVER_ENGINE=${WEBSERVER_ENGINE:-uvicorn}
      # Redis connection for health checks
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          # A ceiling the kernel enforces by FREEZING the process when it
          # is reached, and this one was reached constantly: 1,515 stalls
          # in 12,803 periods, 83s frozen (cpu.stat, 2026-09-20). One
          # async loop serves every page, every htmx fragment, Flet's
          # Overseer and Illiana's streamed replies, so each freeze stops
          # all of it at once. 16 cores on the host; this costs nothing
          # until it is needed.
          cpus: '2.0'
    profiles:
      - dev
      - prod
  # Scheduler service (runs scheduler tasks independently)
  scheduler:
    <<: *app
    command:
      - scheduler
    healthcheck:
      test: ["CMD", "python", "-m", "app.components.scheduler.heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Docker container marker
      - DOCKER_CONTAINER=1
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # The scheduled backup job writes here. Without the volume below the
      # dumps land in the container's writable layer and are destroyed by
      # the next `up --force-recreate` - i.e. every deploy - so they are
      # not restorable and only cost disk.
      - DATABASE_BACKUP_DIR=/var/backups/app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          # 231 throttles in 4,164 periods on 0.25 - its jobs touch the
          # same database and services everything else does.
          cpus: '0.5'
    profiles:
      - dev
      - prod
  # Load Test Worker (high-performance load testing tasks)
  worker-load-test:
    <<: *app
    command:
      - worker
      - load_test
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    tty: true
    environment:
      # Docker container marker for entrypoint script
      - DOCKER_CONTAINER=1
      # Load test worker configuration
      - WORKER_QUEUE_TYPE=load_test
      - WORKER_TIMEOUT_SECONDS=${LOAD_TEST_WORKER_TIMEOUT:-60}
      - WORKER_MAX_TRIES=${LOAD_TEST_WORKER_MAX_TRIES:-1}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    deploy:
      resources:
        limits:
          memory: 256M
          # Left at a whole core deliberately. It looked wrong sitting
          # above the webserver's 0.5, but the webserver was the thing
          # that was wrong - and a ceiling costs nothing until it is hit,
          # so lowering this reclaimed nothing. It would only throttle the
          # harness during the load test it exists to run.
          cpus: '1.0'
    profiles:
      - dev
      - prod


  # System Worker (maintenance and administrative tasks)
  worker-system:
    <<: *app
    command:
      - worker
      - system
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    tty: true
    environment:
      # Docker container marker for entrypoint script
      - DOCKER_CONTAINER=1
      # System worker configuration (high reliability)
      - WORKER_QUEUE_TYPE=system
      - WORKER_TIMEOUT_SECONDS=${SYSTEM_WORKER_TIMEOUT:-1800}
      - WORKER_MAX_TRIES=${SYSTEM_WORKER_MAX_TRIES:-5}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    # Not a maintenance worker any more: finance_import_task and
    # extract_document_task both run here. An 18,618-row import was
    # SIGKILLed twelve seconds in on 256M (2026-09-19) - the container
    # idles near 110 MiB before the finance service is imported, and the
    # plan holds every existing transaction and every planned row at
    # once. 0.25 CPU is what made it slow on top of dead.
    deploy:
      resources:
        limits:
          # Not a maintenance worker once finance or documents are in the
          # stack: finance_import_task and extract_document_task both land
          # on this queue and are the heaviest jobs the app has. An
          # 18,618-row import measured 253 MiB in its planning step alone -
          # a pure read, before a single write - so 256M killed it twelve
          # seconds in, and restart + WORKER_MAX_TRIES made that a retry
          # loop. 0.25 CPU made it slow as well as dead.
          memory: ${SYSTEM_WORKER_MEMORY:-1G}
          cpus: '${SYSTEM_WORKER_CPUS:-1.0}'
    profiles:
      - dev
      - prod
  # REDIS SERVICE

  redis:
    image: redis:7-alpine
    hostname: redis
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    profiles:
      - dev
      - prod

  # TEST PROFILE

  test_runner:
    <<: *app
    command:
      - test
    env_file:
      - ${AEGIS_STACK_ENV_FILE:-.env}
    profiles:
      - test

volumes:
  aegis-data:
  storage-data:
  backup-data:
