# Traefik Static Configuration
# Generated by Aegis Stack

api:
  dashboard: true
  insecure: true  # Dashboard accessible without auth (dev mode)

ping:
  entryPoint: traefik

entryPoints:
  web:
    address: ":80"
    transport:
      respondingTimeouts:
        readTimeout: "0s"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: "0s"
  traefik:
    address: ":8080"

serversTransport:
  forwardingTimeouts:
    dialTimeout: "5s"
    responseHeaderTimeout: "0s"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: aegis-steward_default
    # The provider watches the whole Docker daemon, and every generated stack
    # names its router and service "webserver": without this, another stack
    # running on the same machine joins this one's load balancer.
    constraints: "Label(`com.docker.compose.project`, `aegis-steward`)"

certificatesResolvers:
  letsencrypt:
    acme:
      # Filled in from ACME_EMAIL when the prod container starts
      # (docker-compose.prod.yml): the repo is public.
      email: __ACME_EMAIL__
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO

accessLog: {}
