<li id="envelope-{{ envelope.account_id }}" {% if oob %}hx-swap-oob="outerHTML"{% endif %} class="rounded-lg border border-aegis-border bg-aegis-card p-4 flex flex-col gap-2">
  <div class="flex items-center justify-between gap-3">
    <span class="text-sm text-aegis-text truncate">{{ envelope.name }}</span>
    <span class="tabular-nums text-lg font-semibold {{ 'text-error' if envelope.balance < 0 else 'text-aegis-text' }}">{{ envelope.balance|money }}</span>
  </div>
  <p class="text-xxs text-aegis-muted">{% if envelope.auto_credit and envelope.monthly_credit %}+{{ envelope.monthly_credit|money }}/{{ "wk" if envelope.cadence == "weekly" else "mo" }} automatically{% else %}topped up by hand{% endif %}</p>
  <div class="flex items-center gap-2 text-xs">
    <button type="button" hx-get="{{ path }}/envelopes/{{ envelope.account_id }}/credit" hx-target="#dialog-body" class="px-2.5 py-1 rounded border border-aegis-teal text-aegis-text hover:bg-aegis-teal/10 transition-colors">Credit</button>
    <button type="button" hx-get="{{ path }}/envelopes/{{ envelope.account_id }}/spend" hx-target="#dialog-body" class="px-2.5 py-1 rounded border border-aegis-border text-aegis-muted hover:text-aegis-text transition-colors">Spend</button>
    <button type="button" hx-get="{{ path }}/envelopes/{{ envelope.account_id }}/edit" hx-target="#dialog-body" class="px-2.5 py-1 rounded border border-aegis-border text-aegis-muted hover:text-aegis-text transition-colors">Edit</button>
    <button type="button" hx-delete="{{ path }}/envelopes/{{ envelope.account_id }}" hx-target="#envelope-{{ envelope.account_id }}" hx-swap="outerHTML" hx-confirm="Remove {{ envelope.name }}? Its history goes with it." class="ml-auto text-aegis-muted hover:text-error" aria-label="Remove envelope">×</button>
  </div>
</li>
