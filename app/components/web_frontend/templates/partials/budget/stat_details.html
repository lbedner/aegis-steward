<h2 class="text-lg font-semibold text-aegis-text mb-4">{{ title }}</h2>
{% if rows %}
<ul id="stat-rows" class="divide-y divide-aegis-border/60 text-sm">
  {% for row in rows %}
  <li class="flex items-center gap-3 py-1.5">
    <span class="flex-1 text-aegis-text truncate">{{ row.label }}</span>
    {% if row.caption %}<span class="text-xxs text-aegis-muted">{{ row.caption }}</span>{% endif %}
    <span class="tabular-nums {{ 'text-error' if row.value < 0 else 'text-aegis-text' }}">{{ row.value|money }}</span>
  </li>
  {% endfor %}
</ul>
{% else %}
<p id="dialog-note" class="text-sm text-aegis-muted">Nothing here for this month.</p>
{% endif %}
{% if footer %}<p class="mt-3 text-xxs text-aegis-muted">{{ footer }}</p>{% endif %}
