{# Primary navigation. Included by layouts/app_shell.html inside its
   ``mobileOpen`` Alpine scope: off-canvas on mobile, a fixed column on
   desktop. The section links are rendered from the ``NAV`` list in P1.3;
   until then the nav is an empty landmark. #}
<aside id="sidebar"
       aria-label="Primary"
       :class="mobileOpen ? 'translate-x-0' : '-translate-x-full'"
       class="fixed inset-y-0 left-0 z-40 w-60 flex flex-col bg-aegis-card border-r border-aegis-border
              transform transition-transform duration-200
              md:static md:translate-x-0 md:h-screen md:shrink-0">
  <div class="h-14 shrink-0 flex items-center px-4 border-b border-aegis-border">
    <a href="/" class="text-sm font-semibold text-aegis-teal tracking-wide">{{ project_name }}</a>
  </div>

  <nav aria-label="Sections" class="flex-1 min-h-0 overflow-y-auto py-4 px-2 space-y-0.5">
  </nav>
</aside>
